name: Build MQTT-C Static Library

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up MinGW
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make

    - name: Build Static Library
      run: |
        cd src
        mingw32-make CC=gcc AR=ar RANLIB=ranlib libmqtt.a
      env:
        PATH: /mingw64/bin:$PATH

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: mqtt-lib
        path: src/libmqtt.a
